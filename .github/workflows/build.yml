name: Build and Release Cross-Platform App

on:
  push:
    branches:
      - main
    paths:
      - 'youtube_indir.py'
      - 'YTIndir.spec'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  clean-and-prepare-release:
    name: Prepare Release & Clean Artifacts
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Any Old Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for any remaining artifacts in the repo..."
          artifacts=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id' || true)
          if [ -n "$artifacts" ]; then
            for id in $artifacts; do
              echo "Deleting artifact ID: $id"
              gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/$id || true
            done
          fi

      - name: Generate Short SHA & Timestamp
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Reset 'latest' Release & Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          sleep 2
          gh release create latest \
            --title "Latest Release (${{ steps.meta.outputs.short_sha }} • ${{ steps.meta.outputs.build_date }})" \
            --notes "Building Windows and macOS binaries..." \
            --target ${{ github.sha }}

  build-windows:
    name: Build Windows Executable
    needs: [clean-and-prepare-release]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Setup FFmpeg
        id: setup-ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy FFmpeg into Project
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          $binDir = "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}"
          Write-Host "FFmpeg binary directory: $binDir"
          Copy-Item "$binDir\ffmpeg.exe" ffmpeg\ffmpeg.exe -Force
          Copy-Item "$binDir\ffprobe.exe" ffmpeg\ffprobe.exe -Force
          .\ffmpeg\ffmpeg.exe -version
          .\ffmpeg\ffprobe.exe -version

      - name: Build Executable with PyInstaller
        run: |
          python youtube_indir.py --build-icon build/icons
          pyinstaller --clean --noconfirm YTIndir.spec

      - name: Upload Windows Executable Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          Write-Host "Uploading YTIndir.exe directly to GitHub Release (bypassing artifact storage)..."
          gh release upload latest dist/YTIndir.exe --clobber -R ${{ github.repository }}

  build-macos:
    name: Build macOS Application
    needs: [clean-and-prepare-release]
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Download Static FFmpeg Binaries
        run: |
          mkdir -p ffmpeg
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="x64"
          fi
          TAG="b6.1.1"
          curl -fSL --retry 3 --retry-delay 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/${TAG}/ffmpeg-darwin-${ARCH}.gz" | gunzip > ffmpeg/ffmpeg
          curl -fSL --retry 3 --retry-delay 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/${TAG}/ffprobe-darwin-${ARCH}.gz" | gunzip > ffmpeg/ffprobe
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          otool -L ffmpeg/ffmpeg
          ffmpeg/ffmpeg -version
          ffmpeg/ffprobe -version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Build macOS App Bundle
        run: |
          python youtube_indir.py --build-icon build/icons
          pyinstaller --clean --noconfirm YTIndir.spec

      - name: Package macOS App into Zip
        run: |
          cd dist
          zip -r -y YTIndir-macOS.zip "YT İndir.app"

      - name: Upload macOS Application Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading YTIndir-macOS.zip directly to GitHub Release (bypassing artifact storage)..."
          gh release upload latest dist/YTIndir-macOS.zip --clobber -R ${{ github.repository }}

  finalize-release:
    name: Finalize Release Notes
    needs: [clean-and-prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Update Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ needs.clean-and-prepare-release.outputs.short_sha }}
          BUILD_DATE: ${{ needs.clean-and-prepare-release.outputs.build_date }}
        run: |
          gh release edit latest -R ${{ github.repository }} --notes "### Automated Build: \`$SHORT_SHA\`
          **Built on:** $BUILD_DATE

          ### Downloads:
          - **Windows**: [YTIndir.exe](https://github.com/${{ github.repository }}/releases/download/latest/YTIndir.exe)
          - **macOS**: [YTIndir-macOS.zip](https://github.com/${{ github.repository }}/releases/download/latest/YTIndir-macOS.zip) (unzip and move \`YT İndir.app\` to Applications)"
