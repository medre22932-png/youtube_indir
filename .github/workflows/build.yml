name: Build and release desktop apps

on:
  push:
    branches:
      - main
    paths:
      - 'youtube_indir.py'
      - 'YTIndir.spec'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  clean-and-prepare-release:
    name: Prepare Release & Clean Artifacts
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Delete Any Old Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for any remaining artifacts in the repo..."
          artifacts=$(gh api --paginate /repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[].id' || true)
          if [ -n "$artifacts" ]; then
            for id in $artifacts; do
              echo "Deleting artifact ID: $id"
              gh api --method DELETE /repos/${{ github.repository }}/actions/artifacts/$id || true
            done
          fi

      - name: Generate Short SHA & Timestamp
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Reset 'latest' Release & Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} || true
          gh api -X DELETE /repos/${{ github.repository }}/git/refs/tags/latest || true
          sleep 2
          gh release create latest \
            --title "Latest Release (${{ steps.meta.outputs.short_sha }} • ${{ steps.meta.outputs.build_date }})" \
            --notes "Building Windows and macOS binaries..." \
            --target ${{ github.sha }}
          gh release upload latest youtube_indir.py --clobber -R ${{ github.repository }}

  build-windows:
    name: Build Windows Executable
    needs: [clean-and-prepare-release]
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Setup FFmpeg
        id: setup-ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64
          linking-type: static
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy FFmpeg into Project
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg
          $binDir = "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}"
          Write-Host "FFmpeg binary directory: $binDir"
          Copy-Item "$binDir\ffmpeg.exe" ffmpeg\ffmpeg.exe -Force
          Copy-Item "$binDir\ffprobe.exe" ffmpeg\ffprobe.exe -Force
          .\ffmpeg\ffmpeg.exe -version | Select-Object -First 1
          .\ffmpeg\ffprobe.exe -version | Select-Object -First 1

      - name: Check Python Source
        run: python -m py_compile youtube_indir.py

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm YTIndir.spec

      - name: Upload Windows Executable Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $hash = (Get-FileHash dist/YTIndir.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  YTIndir.exe`n" | Set-Content -NoNewline -Encoding utf8 dist/YTIndir.exe.sha256
          Write-Host "Uploading YTIndir.exe directly to GitHub Release (bypassing artifact storage)..."
          gh release upload latest dist/YTIndir.exe dist/YTIndir.exe.sha256 --clobber -R ${{ github.repository }}

  build-macos:
    name: Build macOS Application
    needs: [clean-and-prepare-release]
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Download Static FFmpeg Binaries
        run: |
          mkdir -p ffmpeg
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="x64"
          fi
          TAG="b6.1.1"
          curl -fSL --retry 3 --retry-delay 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/${TAG}/ffmpeg-darwin-${ARCH}.gz" | gunzip > ffmpeg/ffmpeg
          curl -fSL --retry 3 --retry-delay 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/${TAG}/ffprobe-darwin-${ARCH}.gz" | gunzip > ffmpeg/ffprobe
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          otool -L ffmpeg/ffmpeg
          ffmpeg/ffmpeg -version | head -n 1
          ffmpeg/ffprobe -version | head -n 1

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Check Python Source
        run: python -m py_compile youtube_indir.py

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean --noconfirm YTIndir.spec

      - name: Package macOS App into Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/YT İndir.app' dist/YTIndir-macos-arm64.zip
          shasum -a 256 dist/YTIndir-macos-arm64.zip | sed 's|dist/||' > dist/YTIndir-macos-arm64.zip.sha256

      - name: Upload macOS Application Directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading YTIndir-macos-arm64.zip directly to GitHub Release (bypassing artifact storage)..."
          gh release upload latest dist/YTIndir-macos-arm64.zip dist/YTIndir-macos-arm64.zip.sha256 --clobber -R ${{ github.repository }}

  finalize-release:
    name: Finalize Release Notes
    needs: [clean-and-prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Update Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ needs.clean-and-prepare-release.outputs.short_sha }}
          BUILD_DATE: ${{ needs.clean-and-prepare-release.outputs.build_date }}
        run: |
          gh release download latest --pattern '*.sha256' --dir checksums -R ${{ github.repository }}
          cat checksums/YTIndir.exe.sha256 checksums/YTIndir-macos-arm64.zip.sha256 > SHA256SUMS
          gh release upload latest SHA256SUMS --clobber -R ${{ github.repository }}
          gh release edit latest -R ${{ github.repository }} --latest --notes "### Automated Build: \`$SHORT_SHA\`
          **Built on:** $BUILD_DATE

          ### Downloads:
          - **Windows**: [YTIndir.exe](https://github.com/${{ github.repository }}/releases/download/latest/YTIndir.exe)
          - **macOS (Apple Silicon)**: [YTIndir-macos-arm64.zip](https://github.com/${{ github.repository }}/releases/download/latest/YTIndir-macos-arm64.zip) (unzip and move \`YT İndir.app\` to Applications)
          - **Single Python source**: [youtube_indir.py](https://github.com/${{ github.repository }}/releases/download/latest/youtube_indir.py)
          - **SHA-256 checksums**: [SHA256SUMS](https://github.com/${{ github.repository }}/releases/download/latest/SHA256SUMS)"
