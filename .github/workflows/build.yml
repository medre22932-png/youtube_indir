name: Build and release desktop apps
on:
  push:
    branches: [main]
    paths:
      - youtube_indir.py
      - YTIndir.spec
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch:
concurrency:
  group: build-and-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare-release:
    name: Prepare latest release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Remove old Actions artifacts
        shell: bash
        run: |
          ids=$(gh api --paginate "repos/$GH_REPO/actions/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
      - name: Prepare draft latest release
        shell: bash
        run: |
          existing=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "latest") | .tagName')
          if [[ "$existing" == "latest" ]]; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest --target "$BUILD_SHA" --draft \
            --title "Latest build (${BUILD_SHA:0:7})" \
            --notes 'Building and checking Windows and Apple Silicon macOS downloads.'
          gh release upload latest youtube_indir.py --clobber
  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python packages on GitHub
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11"
      - name: Install FFmpeg on macOS runner
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $binary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw 'FFmpeg installation missing' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Python source
        run: python -m py_compile youtube_indir.py
      - name: Package Python, Qt, FFmpeg and dependencies
        run: python -m PyInstaller --clean --noconfirm YTIndir.spec
      - name: Check packaged binaries and GUI
        shell: python
        env:
          # Exercise the actual Windows plugin used by desktop users.
          # macOS keeps the headless plugin for the hosted runner.
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          QT_DEBUG_PLUGINS: '1'
          YTINDIR_DATA_DIR: ${{ runner.temp }}/ytindir-smoke
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          executable = Path("dist/YTIndir.exe" if os.name == "nt" else
                            "dist/YT İndir.app/Contents/MacOS/YTIndir").resolve()
          if not executable.is_file():
              raise FileNotFoundError(f"Packaged app missing: {executable}")
          root = Path(os.environ["YTINDIR_DATA_DIR"])
          root.mkdir(parents=True, exist_ok=True)
          for name in ("bundle-check.json", "smoke.json", "preview.png", "smoke.log"):
              (root / name).unlink(missing_ok=True)
          for option in ("--check-bundle", "--smoke-test"):
              print(f"Running: {executable} {option}", flush=True)
              try:
                  result = subprocess.run([str(executable), option], timeout=120,
                                          capture_output=True, text=True, errors="replace")
              finally:
                  diagnostic = root / "smoke.log"
                  if diagnostic.is_file():
                      print(diagnostic.read_text(encoding="utf-8", errors="replace"), flush=True)
              print(result.stdout, flush=True)
              print(result.stderr, flush=True)
              print(f"Exit code: {result.returncode} (0x{result.returncode & 0xffffffff:08X})", flush=True)
              if result.returncode:
                  raise RuntimeError(f"Packaged app failed: {option}; see output above")
          for name in ("bundle-check.json", "smoke.json"):
              path = root / name
              if not path.is_file():
                  raise RuntimeError(f"App exited without producing {path}")
              report = json.loads(path.read_text(encoding="utf-8"))
              print(f"{name}: {report}", flush=True)
              assert report["frozen"], f"Check did not run the packaged app: {name}"
              if name == "smoke.json":
                  assert report["platform"] == os.environ["QT_QPA_PLATFORM"], report
          assert (root / "preview.png").is_file(), "GUI screenshot missing"
      - name: Archive macOS app preserving permissions and links
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/YT İndir.app' dist/YTIndir-${{ matrix.platform }}.zip
      - name: Upload directly to latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export RELEASE_ASSET=dist/YTIndir.exe
          else
            export RELEASE_ASSET=dist/YTIndir-macos-arm64.zip
          fi
          python -c "import hashlib, os; from pathlib import Path; p=Path(os.environ['RELEASE_ASSET']); Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n', encoding='utf-8')"
          gh release upload latest "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" --clobber
  finalize-release:
    name: Publish checked downloads
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Combine checksums and publish release
        shell: bash
        run: |
          gh release download latest --pattern '*.sha256' --dir checksums
          cat checksums/YTIndir.exe.sha256 checksums/YTIndir-macos-arm64.zip.sha256 > SHA256SUMS
          gh release upload latest SHA256SUMS --clobber
          cat > release-notes.md <<EOF
          Built from commit \`$BUILD_SHA\`. Both packaged apps passed GUI and FFmpeg checks.

          Downloads:
          - [Windows x64 — YTIndir.exe](https://github.com/$GH_REPO/releases/download/latest/YTIndir.exe)
          - [Apple Silicon Mac — ZIP](https://github.com/$GH_REPO/releases/download/latest/YTIndir-macos-arm64.zip)
          - [Single Python source](https://github.com/$GH_REPO/releases/download/latest/youtube_indir.py)
          - [SHA-256 checksums](https://github.com/$GH_REPO/releases/download/latest/SHA256SUMS)

          Windows: run the EXE directly. Mac: unzip and move YT İndir.app to Applications.
          Saved settings and engine updates remain in your user data folder.
          EOF
          gh release edit latest --draft=false --latest --notes-file release-notes.md
